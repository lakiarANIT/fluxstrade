services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      FLASK_ENV: development
      SESSION_FILE_DIR: /app/.flask_session
    volumes:
      - ./backend:/app
      - backend_session:/app/.flask_session
    command: flask --app app run --debug --host 0.0.0.0 --port 5000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  backend_session:
